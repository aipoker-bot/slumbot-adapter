[project]
name = "slumbot-adapter"
version = "0.1.0"
description = "Parse Slumbot's heads-up NLHE action strings and play against slumbot.com through its public API."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["httpx>=0.25"]
keywords = ["poker", "slumbot", "cfr", "heads-up", "benchmark"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.urls]
Homepage = "https://aipoker.bot"
Methodology = "https://aipoker.bot/methodology"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["slumbot_adapter*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
